		<style>
		 html, body {
		    margin: 0;
		    padding: 0;
		  }

		  * {
		    box-sizing: border-box;
		  }

		  .iw-error-wrap {
		    max-width: 1000px;
		    margin: auto;
		    text-align: center;
		    background-color: #ffffff;
		 	padding: 60px 40px;
		    margin-top: 140px;
		  } 

		  .error-box img {
		    max-width: 170px;
		    height: auto;
		    margin-bottom: 15px;
		  }

		  .error-msg {
		    display: block;
		    font-size: 25px;
		    color: #333333;
		    margin-top: 20px;
		    font-weight: 550;
		  }

		  .error-code {
		    display: block;
		    font-size: 80px;
		    color: #000000;
		    font-weight: bold;
		    margin-bottom: 10px;
		  }

		    .error-desc {
		    display: block;
		    margin-top: 20px;
		    font-size: 15px;
		    color: #666666;
		    line-height: 1.8;
		     margin-bottom:25px;
		  }
		  
		   .error-tel {
		  color : #999999;
		  font-size:14px;
		  margin-top:150px;
		 
		  }

		  .btn-wrap {
		    margin-top: 20px;
		  }

		  .btn {
		    display: inline-block;
		    padding: 14px 28px;
		    background-color: #007BFF;
		    color: #ffffff !important;
          text-decoration: none;
		    font-size: 16px;
		    border-radius: 4px;
		    transition: background-color 0.3s ease;
		  }

		  .btn:hover {
		    background-color: #0056b3;
		  }
		</style>
	</head>
	<body>
		<div>
		    <div>

		          </span>

							02-867-9765 &nbsp;✉ &nbsp; bizinfo@kosi.re.kr </span></div>
		        <div class="btn-wrap">
