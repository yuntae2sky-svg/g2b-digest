name: g2b-diagnose5
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe bizinfo API (no key in report)
        continue-on-error: true
        env:
          BIZINFO_KEY: ${{ secrets.BIZINFO_KEY }}
          OUTDIR: diag5/run${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p "$OUTDIR"
          echo "| target | try | curl_exit | http | bytes | sec |" > "$OUTDIR/report.md"
          echo "|---|---|---|---|---|---|" >> "$OUTDIR/report.md"
          probe() {
            name="$1"; url="$2"; out="$OUTDIR/$name.raw"
            for t in 1 2 3; do
              set +e
              res=$(curl -sS -L --connect-timeout 20 --max-time 90 -A "g2b-digest-diagnose/1.0 (personal research)" \
                -o "$out" -w "%{http_code}|%{size_download}|%{time_total}" "$url" 2>/dev/null)
              rc=$?
              set -e
              echo "| $name | $t | $rc | $(echo "$res" | cut -d'|' -f1) | $(echo "$res" | cut -d'|' -f2) | $(echo "$res" | cut -d'|' -f3) |" >> "$OUTDIR/report.md"
              [ "$rc" = "0" ] && break
              sleep 10
            done
            [ -f "$out" ] && head -c 60000 "$out" > "$OUTDIR/$name.txt" || true
            rm -f "$out"
          }
          probe plain_page "https://www.bizinfo.go.kr/apiList.do"
          probe api_json "https://www.bizinfo.go.kr/uss/rss/bizinfoApi.do?crtfcKey=${BIZINFO_KEY}&dataType=json&searchCnt=50"
      - name: Commit results
        if: always()
        run: |
          git config user.name "g2b-bot"
          git config user.email "g2b-bot@users.noreply.github.com"
          git add diag5
          git diff --staged --quiet || git commit -m "diagnose5 report"
          git pull --rebase
          git push
