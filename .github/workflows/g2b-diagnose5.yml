name: g2b-diagnose5
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe bizinfo API (1 request)
        env:
          BIZINFO_KEY: ${{ secrets.BIZINFO_KEY }}
        run: |
          mkdir -p diag5
          code=$(curl -sS -L --max-time 60 -A "g2b-digest-diagnose/1.0 (personal research)" \
            -o diag5/sample_full.json \
            -w "%{http_code}|%{size_download}|%{time_total}" \
            "https://www.bizinfo.go.kr/uss/rss/bizinfoApi.do?crtfcKey=${BIZINFO_KEY}&dataType=json&searchCnt=50" 2>&1 | tr '\n' ' ' || true)
          echo "http|bytes|sec = $code" > diag5/report.md
          head -c 60000 diag5/sample_full.json > diag5/sample.json
          rm -f diag5/sample_full.json
      - name: Commit results
        run: |
          git config user.name "g2b-bot"
          git config user.email "g2b-bot@users.noreply.github.com"
          git add diag5
          git diff --staged --quiet || git commit -m "diagnose5 report"
          git pull --rebase
          git push
