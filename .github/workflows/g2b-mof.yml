name: g2b-mof
on:
  workflow_dispatch:
  schedule:
    - cron: "10 21 * * *"
permissions:
  contents: write
jobs:
  mof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch mof boards
        run: python3 fetch_mof.py
      - name: Commit results
        run: |
          git config user.name "g2b-bot"
          git config user.email "g2b-bot@users.noreply.github.com"
          git add mof.md mof_state.json
          git diff --staged --quiet || git commit -m "mof digest"
          git pull --rebase
          git push
