name: g2b-sealife
on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *"
permissions:
  contents: write
jobs:
  sealife:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch sealife notices
        run: python3 fetch_sealife.py
      - name: Commit results
        run: |
          git config user.name "g2b-bot"
          git config user.email "g2b-bot@users.noreply.github.com"
          git add sealife.md sealife_state.json
          git diff --staged --quiet || git commit -m "sealife digest"
          git pull --rebase
          git push
